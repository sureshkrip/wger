# =============================================================================
# wger - Docker Compose stack for Coolify (single-container web, no nginx)
#
#   web (Django, serves app + static) + postgres + redis + celery worker/beat
#
# Coolify's Traefik proxy routes cleanly to the `web` service (it would not
# route to a separate nginx sidecar), so the web container serves static files
# itself via `runserver --insecure` (DEBUG stays False, so this is safe -- it
# only tells Django to serve collected static files without DEBUG).
#
# In Coolify: set the app's "Domains for web" to your FQDN (leave the other
# services' domains empty) and set the secrets below (SECRET_KEY,
# POSTGRES_PASSWORD, SITE_URL, TIME_ZONE) in the Environment Variables tab.
#
# NOTE: user-uploaded / exercise media images are not served in this mode.
# For media, configure S3 storage (AWS_* env vars) later, which wger supports.
# =============================================================================

x-app-env: &app-env
  # --- Security ---
  SECRET_KEY: ${SECRET_KEY:?set a long random SECRET_KEY}
  DJANGO_DEBUG: "False"

  # --- Site / proxy ---
  SITE_URL: ${SITE_URL:-http://localhost}
  WGER_USE_GUNICORN: "False"
  USE_X_FORWARDED_HOST: "True"
  X_FORWARDED_PROTO_HEADER_SET: "True"

  # --- Database (must match the postgres service credentials below) ---
  PS_DATABASE_URI: postgres://${POSTGRES_USER:-wger}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wger}
  DJANGO_PERFORM_MIGRATIONS: "True"

  # --- Cache + Celery (redis service is named "cache") ---
  DJANGO_CACHE_BACKEND: django_redis.cache.RedisCache
  DJANGO_CACHE_LOCATION: redis://cache:6379/1
  DJANGO_CACHE_CLIENT_CLASS: django_redis.client.DefaultClient
  CELERY_BROKER: redis://cache:6379/2
  CELERY_BACKEND: redis://cache:6379/2
  USE_CELERY: "True"

  # --- Paths ---
  DJANGO_MEDIA_ROOT: /home/wger/media
  DJANGO_STATIC_ROOT: /home/wger/static

  # --- First-boot data sync (kept off so boots are fast; run manually later) ---
  SYNC_EXERCISES_ON_STARTUP: ${SYNC_EXERCISES_ON_STARTUP:-False}
  DOWNLOAD_EXERCISE_IMAGES_ON_STARTUP: ${DOWNLOAD_EXERCISE_IMAGES_ON_STARTUP:-False}

  # --- Locale ---
  TIME_ZONE: ${TIME_ZONE:-UTC}
  TZ: ${TIME_ZONE:-UTC}

services:
  web:
    image: docker.io/wger/server:latest
    restart: unless-stopped
    environment: *app-env
    # Override the default entrypoint so we can pass --insecure to runserver,
    # which makes Django serve the collected static files with DEBUG=False.
    # The steps mirror the image's own entrypoint bootstrap.
    command:
      - /bin/bash
      - -lc
      - |
        set -e
        wger bootstrap --no-process-static
        python3 manage.py collectstatic --no-input --clear
        python3 manage.py migrate
        python3 manage.py set-site-url
        exec python3 manage.py runserver 0.0.0.0:8000 --insecure
    volumes:
      - media:/home/wger/media
      - static:/home/wger/static
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  celery_worker:
    image: docker.io/wger/server:latest
    restart: unless-stopped
    command: /start-worker
    environment: *app-env
    volumes:
      - media:/home/wger/media
      - static:/home/wger/static
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "wger", "inspect", "ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  celery_beat:
    image: docker.io/wger/server:latest
    restart: unless-stopped
    command: /start-beat
    environment: *app-env
    volumes:
      - celery-beat:/home/wger/beat
    depends_on:
      web:
        condition: service_healthy

  db:
    image: docker.io/postgres:16
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-wger}
      TZ: ${TIME_ZONE:-UTC}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wger} -d ${POSTGRES_DB:-wger}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: docker.io/redis:7
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  celery-beat:
  media:
  static:
