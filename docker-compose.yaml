# =============================================================================
# wger - self-contained Docker Compose stack for Coolify (and plain `docker compose`)
#
# Flattened from the official https://github.com/wger-project/docker stack:
#   web + postgres + redis + celery worker/beat + nginx.
# PowerSync (optional mobile offline-sync) is intentionally omitted.
#
# In Coolify: create a "Docker Compose" resource pointing at this repo / branch `main`,
# then set the secrets below (SECRET_KEY, POSTGRES_PASSWORD, SITE_URL, ...) in the UI.
# Point Coolify's domain at the `nginx` service (port 80).
# =============================================================================

# Shared environment for web + celery services (they run the same image).
x-app-env: &app-env
  # --- Security ---
  SECRET_KEY: ${SECRET_KEY:?set a long random SECRET_KEY}
  DJANGO_DEBUG: "False"

  # --- Site / proxy ---
  SITE_URL: ${SITE_URL:-http://localhost}
  WGER_USE_GUNICORN: "True"
  USE_X_FORWARDED_HOST: "True"
  X_FORWARDED_PROTO_HEADER_SET: "True"

  # --- Database (must match the postgres service credentials below) ---
  PS_DATABASE_URI: postgres://${POSTGRES_USER:-wger}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wger}
  DJANGO_PERFORM_MIGRATIONS: "True"

  # --- Cache + Celery (redis service is named "cache") ---
  DJANGO_CACHE_BACKEND: django_redis.cache.RedisCache
  DJANGO_CACHE_LOCATION: redis://cache:6379/1
  DJANGO_CACHE_CLIENT_CLASS: django_redis.client.DefaultClient
  CELERY_BROKER: redis://cache:6379/2
  CELERY_BACKEND: redis://cache:6379/2
  USE_CELERY: "True"

  # --- Paths (backed by named volumes shared with nginx) ---
  DJANGO_MEDIA_ROOT: /home/wger/media
  DJANGO_STATIC_ROOT: /home/wger/static

  # --- First-boot data sync (optional; adds time to the first startup) ---
  SYNC_EXERCISES_ON_STARTUP: ${SYNC_EXERCISES_ON_STARTUP:-True}
  DOWNLOAD_EXERCISE_IMAGES_ON_STARTUP: ${DOWNLOAD_EXERCISE_IMAGES_ON_STARTUP:-False}

  # --- Locale ---
  TIME_ZONE: ${TIME_ZONE:-UTC}
  TZ: ${TIME_ZONE:-UTC}

services:
  web:
    # Prebuilt image = identical to this repo's code. To deploy your own code
    # changes instead, comment out `image:` and uncomment the `build:` block.
    image: docker.io/wger/server:latest
    # build:
    #   context: .
    #   dockerfile: extras/docker/production/Dockerfile
    restart: unless-stopped
    environment: *app-env
    volumes:
      - media:/home/wger/media
      - static:/home/wger/static
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  celery_worker:
    image: docker.io/wger/server:latest
    restart: unless-stopped
    command: /start-worker
    environment: *app-env
    volumes:
      - media:/home/wger/media
      - static:/home/wger/static
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "wger", "inspect", "ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  celery_beat:
    image: docker.io/wger/server:latest
    restart: unless-stopped
    command: /start-beat
    environment: *app-env
    volumes:
      - celery-beat:/home/wger/beat
    depends_on:
      web:
        condition: service_healthy

  db:
    image: docker.io/postgres:16
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-wger}
      TZ: ${TIME_ZONE:-UTC}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wger} -d ${POSTGRES_DB:-wger}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: docker.io/redis:7
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: docker.io/nginx:stable
    restart: unless-stopped
    # Coolify "magic" variable: its presence tells Coolify to generate a
    # Traefik route for this service on container port 80. After deploy,
    # Coolify auto-creates an env var named SERVICE_FQDN_NGINX_80 in the UI's
    # Environment Variables tab -- set its value to your domain, e.g.
    #   https://wger.apps.predaccure.com
    environment:
      - SERVICE_FQDN_NGINX_80
    # `expose` (not `ports`) avoids clashing with Traefik owning host port 80.
    expose:
      - "80"
    # nginx config is provided inline (below) instead of a host bind-mount, so
    # there is no fragile relative-path mount for Coolify's daemon to resolve.
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - static:/wger/static:ro
      - media:/wger/media:ro
    depends_on:
      - web

# Inline nginx configuration. Note: nginx runtime variables are written as
# `$$var` so Docker Compose does NOT interpolate them (it turns `$$` into `$`).
configs:
  nginx_conf:
    content: |
      upstream wger {
          server web:8000;
      }
      server {
          listen 80;
          server_name _;
          client_max_body_size 100M;

          location /static/ {
              alias /wger/static/;
              expires 1y;
              add_header Cache-Control "public, immutable";
          }
          location /media/ {
              alias /wger/media/;
              expires 30d;
              add_header Cache-Control "public";
          }
          location / {
              proxy_pass http://wger;
              proxy_http_version 1.1;
              proxy_set_header Host              $$host;
              proxy_set_header X-Real-IP         $$remote_addr;
              proxy_set_header X-Forwarded-For   $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
              proxy_set_header X-Forwarded-Host  $$host;
              proxy_set_header Upgrade           $$http_upgrade;
              proxy_set_header Connection        "upgrade";
              proxy_read_timeout  86400;
              proxy_send_timeout  86400;
          }
      }

volumes:
  postgres-data:
  redis-data:
  celery-beat:
  media:
  static:
